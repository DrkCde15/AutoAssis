<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Anotações - AutoAssist</title>
    <link rel="icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="shortcut icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="static/fonts/fonts.css">
<style>

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }
        .page-header {
            display: block;
            margin-bottom: 24px;
        }
        .page-title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px;
        }
        .stat-title {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }
        .layout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            min-width: 0;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .field {
            margin-bottom: 12px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }
        textarea,
        input,
        select {
            width: 100%;
            min-width: 0;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }
        textarea {
            min-height: 110px;
            resize: vertical;
        }
        textarea:focus,
        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .field-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }
        .field-row-3 {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
        }
        .btn {
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: #fff;
            width: 100%;
            margin-top: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: #3f3f46;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .form-actions .btn-primary {
            margin-top: 0;
            flex: 1;
        }
        .btn-danger-outline {
            background: transparent;
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }
        .btn-danger-outline:hover {
            border-color: #ef4444;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.08);
        }
        .email-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }
        .switch {
            position: relative;
            width: 48px;
            height: 26px;
            display: inline-block;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            inset: 0;
            background: #3f3f46;
            border-radius: 999px;
            transition: var(--transition);
            cursor: pointer;
        }
        .slider:before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: white;
            transition: var(--transition);
        }
        .switch input:checked + .slider {
            background: var(--accent);
        }
        .switch input:checked + .slider:before {
            transform: translateX(22px);
        }
        .muted {
            color: var(--text-muted);
            font-size: 13px;
        }
        .alerts-list,
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .alert-item,
        .history-item {
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px;
        }
        .item-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }
        .item-title {
            font-weight: 600;
            font-size: 14px;
        }
        .badge {
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            letter-spacing: 0.4px;
        }
        .badge-overdue,
        .badge-atencao {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .badge-due_soon,
        .badge-aviso {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        .badge-on_track,
        .badge-ok {
            background: rgba(34, 197, 94, 0.18);
            color: #4ade80;
        }
        .item-text {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.45;
        }
        .item-meta {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .history-card .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .card-head-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .small-select {
            width: 230px;
            max-width: 100%;
            min-width: 0;
        }
        .actions-inline {
            display: inline-flex;
            gap: 6px;
        }
        .icon-btn {
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            color: var(--text-primary);
            border-color: #3f3f46;
        }
        .icon-btn.delete:hover {
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.35);
            background: rgba(239, 68, 68, 0.08);
        }
        .badge-no-plan {
            background: rgba(113, 113, 122, 0.25);
            color: #d4d4d8;
        }
        .empty {
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
        @media (max-width: 960px) {
            .stats-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .layout-grid {
                grid-template-columns: minmax(0, 1fr);
            }
            .field-row-3 {
                grid-template-columns: minmax(0, 1fr);
            }
            .history-card .card-head {
                flex-direction: column;
                align-items: flex-start;
            }
            .card-head-controls {
                width: 100%;
                flex-direction: column;
            }
            .small-select,
            #veiculoSelect,
            #vehicleFilter {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                flex: 1 1 auto;
            }
        }
        @media (max-width: 680px) {
            .container {
                padding: 22px 14px 48px;
            }
            .page-title {
                font-size: 24px;
            }
            .field-row {
                grid-template-columns: minmax(0, 1fr);
            }
            .history-card .card-head {
                flex-direction: column;
                align-items: flex-start;
            }
            .card-head-controls {
                width: 100%;
                flex-direction: column;
            }
            .small-select {
                width: 100%;
                flex: 1 1 auto;
            }
            .card-head-controls select {
                width: 100%;
                font-size: 14px;
            }
            #veiculoSelect,
            #vehicleFilter,
            #sortFilter {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                min-height: 44px;
            }
            .form-actions {
                flex-direction: column;
            }
        }
        .nav-logo-icon { width:auto; height:auto; background:transparent; border-radius:0; display:flex; align-items:center; justify-content:center; }
        .nav-logo-text { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
        .nav-toggle { display: none; }
        @media (max-width: 768px) {
            .nav-toggle {
                display: inline-flex; align-items: center; justify-content: center;
                margin-left: auto; width: 44px; height: 44px;
                border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
                background: transparent; color: var(--text-primary); font-size: 18px; cursor: pointer;
            }
            .nav-links.nav-open { display: flex; }
        }
</style>

        <div class="nav-container">
            <a href="index.html" class="nav-logo">

                    <img src="logo.png?v=20260608" alt="AutoAssist IA" style="height:84px;width:auto;">

            </a>

<main class="container">
    <header class="page-header">
        <h1 class="page-title">Anotações</h1>
        <p class="page-subtitle">Registre servicos em texto livre, acompanhe gastos e veja retornos automaticos.</p>
    </header>

    <section class="stats-grid" id="statsGrid">
        <article class="stat-card">
            <div class="stat-title">Total gasto</div>
            <div class="stat-value" id="statTotal">R$ 0,00</div>
        </article>
        <article class="stat-card">
            <div class="stat-title">Registros</div>
            <div class="stat-value" id="statCount">0</div>
        </article>
        <article class="stat-card">
            <div class="stat-title">Alertas atrasados</div>
            <div class="stat-value" id="statOverdue">0</div>
        </article>
    </section>

    <section class="layout-grid">
        <article class="card">
            <h2 class="card-title"><i class="fas fa-pen-to-square"></i> Novo registro</h2>
            <div class="field">
                <label for="descricao">Descricao da manutencao</label>
                <textarea id="descricao" placeholder="Ex: Troquei o oleo hoje, gastei R$ 280 e estava com 45.000 km"></textarea>
            </div>
            <div class="field">
                <label for="veiculoSelect">Veiculo (opcional)</label>
                <div id="veiculoSelect" class="app-select" data-placeholder="Carregando veiculos..." aria-label="Veiculo (opcional)"></div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="custo">Custo (opcional)</label>
                    <input id="custo" type="text" placeholder="Ex: 280,90">
                </div>
                <div class="field">
                    <label for="kmServico">KM do servico (opcional)</label>
                    <input id="kmServico" type="number" placeholder="Ex: 45000">
                </div>
            </div>
            <div class="field-row-3">
                <div class="field">
                    <label for="dataServico">Data (opcional)</label>
                    <input id="dataServico" type="date">
                </div>
                <div class="field">
                    <label for="intervaloDias">Intervalo dias (opcional)</label>
                    <input id="intervaloDias" type="number" placeholder="Ex: 180">
                </div>
                <div class="field">
                    <label for="intervaloKm">Intervalo km (opcional)</label>
                    <input id="intervaloKm" type="number" placeholder="Ex: 10000">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="btnSalvarRegistro">
                    <i class="fas fa-plus"></i>
                    Salvar Anotação
                </button>
                <button class="btn btn-ghost" id="btnCancelarEdicao" style="display:none;">
                    <i class="fas fa-xmark"></i>
                    Cancelar
                </button>
            </div>
        </article>

        <article class="card">
            <h2 class="card-title"><i class="fas fa-bell"></i> Alertas inteligentes</h2>
            <div class="email-row">
                <div>
                    <div style="font-weight:600;font-size:14px;">Email automatico diario</div>
                    <div class="muted" id="emailLastSent">Ultimo envio: -</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="emailToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="alerts-list" id="alertsList"></div>
        </article>
    </section>

    <section class="card history-card">
        <div class="card-head">
            <h2 class="card-title" style="margin:0;"><i class="fas fa-clock-rotate-left"></i> Registros salvos</h2>
            <div class="card-head-controls">
                <div id="sortFilter" class="app-select small-select" data-placeholder="Mais recentes" aria-label="Ordenar registros"></div>
                <div id="vehicleFilter" class="app-select small-select" data-placeholder="Carregando veiculos..." aria-label="Filtrar por veiculo"></div>
            </div>
        </div>
        <div class="history-list" id="historyList"></div>
    </section>
</main>
