  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Eventos Automotivos no Brasil • AutoAssist IA</title>
    <meta name="description" content="Agenda de eventos automotivos no Brasil: feiras, encontros, competições, exposições e congressos do setor, atualizados automaticamente pelo AutoAssist IA.">
    <meta name="theme-color" content="#09090b">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AutoAssist IA">
    <meta property="og:title" content="Eventos Automotivos no Brasil • AutoAssist IA">
    <meta property="og:description" content="Feiras, encontros, competições e exposições do setor automotivo brasileiro em um só lugar.">
    <meta property="og:image" content="https://autoassist.com.br/static/logo2.png?v=20260608">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://autoassist.com.br/eventos.html">
    <link rel="icon" type="image/png" href="static/logo2.png?v=20260506">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" referrerpolicy="no-referrer" />

    <style>
      body {
        font-family: var(--font-sans);
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        margin: 0;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 40% at 50% -10%, rgba(59, 130, 246, 0.16), transparent),
          radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.07), transparent);
        pointer-events: none;
        z-index: 0;
      }
      .page {
        position: relative;
      }
      .nav-btn-outline { background: transparent; border-color: rgba(255, 255, 255, 0.16); color: var(--text-primary); }
      .nav-btn-outline:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.28); }

      /* Hero */
      .events-header {
        display: block;
        position: relative;
        z-index: 1;
        max-width: 900px;
        margin: 0 auto;
        padding: 64px 24px 16px;
        text-align: center;
      }
      .events-eyebrow {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }
      .events-header h1 {
        font-size: clamp(28px, 4.5vw, 40px);
        font-weight: 800;
        letter-spacing: -1px;
        margin: 0 0 12px;
      }
      .events-header p {
        margin: 0;
        font-size: 16px;
        line-height: 1.65;
        color: var(--text-secondary);
      }

      /* Lista de eventos */
      .events-main {
        position: relative;
        z-index: 1;
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px 24px 8px;
      }
      .events-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 20px;
        position: relative;
        z-index: 10;
      }
      .results-count {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      .events-tools {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .small-select {
        width: 230px;
        max-width: 100%;
        min-width: 0;
      }
      .events-refresh {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .events-refresh:hover { border-color: var(--accent); color: var(--accent); }
      .events-refresh:disabled { opacity: 0.6; cursor: progress; }

      .events-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
        gap: 18px;
      }
      .event-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 20px 22px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        box-sizing: border-box;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .event-card:hover {
        transform: translateY(-2px);
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 12px 32px rgba(2, 6, 23, 0.35);
      }
      .event-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .event-card h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1.35;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .event-badge {
        flex-shrink: 0;
        font-size: 11px;
        font-weight: 700;
        padding: 5px 10px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .event-badge--agendado { background: rgba(16, 185, 129, 0.14); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
      .event-badge--semdata { background: rgba(148, 163, 184, 0.12); color: var(--text-muted); border: 1px solid var(--border-color); }
      .event-badge--past { background: rgba(239, 68, 68, 0.12); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
      .event-card-desc {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-secondary);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .event-card-meta {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
        min-width: 0;
      }
      .event-card-meta span { display: inline-flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; word-break: break-word; }
      .event-card-meta i { color: var(--accent); width: 14px; text-align: center; }
      .event-card-actions {
        margin-top: auto;
        padding-top: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .event-card-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(59, 130, 246, 0.35);
        transition: all 0.2s ease;
      }
      .event-card-link:hover { background: rgba(59, 130, 246, 0.1); }

      /* Estados de loading/vazio/erro */
      .events-state {
        text-align: center;
        padding: 48px 16px;
        color: var(--text-secondary);
      }
      .events-state i { font-size: 32px; margin-bottom: 12px; color: var(--text-muted); }
      .events-state p { margin: 0 0 16px; font-size: 14px; }
      .events-state .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 12px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: events-spin 0.8s linear infinite;
      }
      @keyframes events-spin { to { transform: rotate(360deg); } }
      .events-retry {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .events-retry:hover { border-color: var(--accent); color: var(--accent); }

      @media (max-width: 760px) {
        .events-header { padding-top: 44px; padding-left: 18px; padding-right: 18px; }
        .events-main { padding-left: 16px; padding-right: 16px; }
        .events-grid { grid-template-columns: 1fr; }
        .events-toolbar {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .results-count {
          width: 100%;
          overflow-wrap: anywhere;
        }
        .events-tools {
          width: 100%;
          flex-wrap: wrap;
        }
        .events-tools .small-select {
          flex: 1 1 auto;
          min-width: 0;
          width: auto;
        }
        #btnEventsRefresh {
          flex: 0 0 auto;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body class="events-page">
    <div class="page">
      <nav class="navbar">
        <div class="nav-container">
          <a href="index.html" class="nav-logo">

          </div>
        </div>
      </nav>

      <header class="events-header" data-aa-reveal>
        <span class="events-eyebrow">Eventos Automotivos</span>
        <h1>Eventos Automotivos no Brasil</h1>
        <p>Feiras, encontros, competições e exposições do setor atualizado automaticamente.</p>
      </header>

      <main class="events-main" aria-label="Lista de eventos automotivos">
        <div class="events-toolbar" data-aa-reveal>
          <div class="results-count" id="eventsCount"></div>

    <script src="static/js/config.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/security-utils.js"></script>
    <script src="static/js/navbar.js"></script>
    <script src="static/js/app-select.js"></script>
    <script src="static/js/notifications.js" defer></script>
    <script src="static/js/responsive.js" defer></script>
    <script src="static/vendor/anime.min.js?v=3.2.2" defer></script>
    <script src="static/vendor/lenis.min.js?v=1.3.26" defer></script>
    <script src="static/js/animations/animations.js?v=1" defer></script>
    <script>
      // Renderiza o header correto ANTES do primeiro paint (sem flash).
      if (typeof Navbar !== 'undefined') {
        Navbar.init({ validate: true });
      }

      document.addEventListener('DOMContentLoaded', () => {
        if (typeof Auth === 'undefined' || !Auth.isAuthenticated()) {
          window.location.href = 'login.html';
          return;
        }
        if (!Auth.requirePremiumPage({
          title: 'Eventos Premium',
          message: 'O mapa de eventos automotivos e mecânicos é exclusivo para usuários Premium.',
          backHref: 'index.html'
        })) {
          return;
        }
        // A navegação mobile (hamburguer + drawer) é fornecida por
        // static/js/responsive.js, como nas demais páginas do AutoAssist.

        const escapeHtml = (value) =>
          typeof SecurityUtils !== 'undefined' && SecurityUtils.escapeHTML
            ? SecurityUtils.escapeHTML(String(value ?? ''))
            : String(value ?? '');

        const CATEGORY_LABELS = {
          feira: 'Feira',
          encontro: 'Encontro',
          competicao: 'Competição',
          exposicao: 'Exposição',
          congresso: 'Congresso',
          outros: 'Outros',
        };

        const BR_UFS = ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO'];

        let allEvents = [];

        function initUfSelect() {
          const el = document.getElementById('eventsUfSelect');
          if (!el || !window.AppSelect || el._appSelect) return;
          const api = AppSelect.mount(el, {
            placeholder: 'Todos os locais',
            searchPlaceholder: 'Pesquisar UF...',
            emptyText: 'Nenhuma UF encontrada'
          });
          const base = Array.isArray(allEvents) ? allEvents.filter((e) => e.uf) : [];
          const foundUfs = [...new Set(base.map((e) => String(e.uf).toUpperCase()))].sort();
          const options = foundUfs.length > 0
            ? foundUfs
            : BR_UFS;
          api.setOptions(
            [{ value: '', label: 'Todos os locais' }]
              .concat(options.map((u) => ({ value: u, label: u })))
          );
          api.onChange(() => renderEvents());
          el._appSelect = api;
        }

        function currentUf() {
          const el = document.getElementById('eventsUfSelect');
          return el ? String(el.value || '').toUpperCase() : '';
        }

        const MONTHS_PT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

        function formatEventDate(event) {
          const start = event.data_inicio ? new Date(event.data_inicio + 'T12:00:00') : null;
          const end = event.data_fim ? new Date(event.data_fim + 'T12:00:00') : null;
          if (!start || isNaN(start.getTime())) {
            return { day: null, periodLabel: '' };
          }
          const d = String(start.getDate()).padStart(2, '0');
          const m = MONTHS_PT[start.getMonth()];
          const y = String(start.getFullYear());
          let periodLabel = `${d} ${m} ${y}`;
          if (end && !isNaN(end.getTime()) && end.toDateString() !== start.toDateString()) {
            const d2 = String(end.getDate()).padStart(2, '0');
            const m2 = MONTHS_PT[end.getMonth()];
            const y2 = String(end.getFullYear());
            if (y === y2 && start.getMonth() === end.getMonth()) {
              periodLabel = `${d} a ${d2} ${m} ${y}`;
            } else if (y === y2) {
              periodLabel = `${d} ${m} a ${d2} ${m2} ${y}`;
            } else {
              periodLabel = `${d} ${m} ${y} a ${d2} ${m2} ${y2}`;
            }
          }
          return { day: d, periodLabel };
        }

        function renderEventCard(event) {
          const dateInfo = formatEventDate(event);
          const where = [event.cidade, event.uf ? `- ${event.uf}` : ''].join(' ').trim();
          const status = (event.status || '').toLowerCase();
          const isPast = !!event.passado;
          let badgeClass, badgeText;
          if (status === 'cancelled') {
            badgeClass = 'event-badge--past';
            badgeText = 'Cancelado';
          } else if (status === 'ongoing') {
            badgeClass = 'event-badge--agendado';
            badgeText = 'Acontecendo';
          } else if (isPast || status === 'finished') {
            badgeClass = 'event-badge--past';
            badgeText = 'Encerrado';
          } else if (dateInfo.day) {
            badgeClass = 'event-badge--agendado';
            badgeText = 'Agendado';
          } else {
            badgeClass = 'event-badge--semdata';
            badgeText = 'Data a confirmar';
          }
          const cat = CATEGORY_LABELS[event.categoria] || '';
          return `
            <article class="event-card">
              <div class="event-card-head">
                <h2>${escapeHtml(event.titulo || 'Evento automotivo')}</h2>
                <span class="event-badge ${badgeClass}">${badgeText}</span>
              </div>
              ${event.descricao ? `<p class="event-card-desc">${escapeHtml(event.descricao)}</p>` : ''}
              <div class="event-card-meta">
                ${dateInfo.periodLabel ? `<span><i class="fas fa-calendar-alt"></i> ${escapeHtml(dateInfo.periodLabel)}</span>` : ''}
                ${(where || event.local) ? `<span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(where || event.local)}${event.local && where ? ` &middot; ${escapeHtml(event.local)}` : ''}</span>` : ''}
                ${cat ? `<span><i class="fas fa-tag"></i> ${escapeHtml(cat)}</span>` : ''}
                ${event.fonte_nome ? `<span><i class="fas fa-building"></i> ${escapeHtml(event.fonte_nome)}</span>` : ''}
              </div>
              ${event.url ? `
                <div class="event-card-actions">
                  <a class="event-card-link" href="${escapeHtml(event.url)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-external-link-alt"></i> Ver detalhes</a>
                </div>
              ` : ''}
            </article>
          `;
        }

        function renderState(message, icon, showRetry) {
          const list = document.getElementById('eventsList');
          const count = document.getElementById('eventsCount');
          if (count) count.textContent = '';
          if (!list) return;
          list.innerHTML = `
            <div class="events-state" style="grid-column: 1 / -1;">
              ${icon ? `<i class="fas ${icon}"></i>` : '<div class="spinner"></div>'}
              <p>${message}</p>
              ${showRetry ? '<button type="button" class="events-retry" id="btnEventsRetry"><i class="fas fa-rotate"></i> Tentar novamente</button>' : ''}
            </div>
          `;
          if (showRetry) {
            const retry = document.getElementById('btnEventsRetry');
            if (retry) retry.addEventListener('click', () => loadEvents(true));
          }
        }

        function renderEvents() {
          const list = document.getElementById('eventsList');
          const count = document.getElementById('eventsCount');
          const uf = currentUf();
          const events = uf
            ? allEvents.filter((e) => String(e.uf || '').trim().toUpperCase() === uf)
            : allEvents;

          if (events.length === 0) {
            renderState('Nenhum evento confirmado neste local neste momento.', 'fa-calendar-alt', false);
          } else {
            list.innerHTML = events.map((e) => renderEventCard(e)).join('');
            if (window.AAAnim && window.AAAnim.reveal) {
              window.AAAnim.reveal.staggerIn(list, '.event-card', { stagger: 45 });
            }
            if (window.AAAnim && window.AAAnim.cards) {
              window.AAAnim.cards.init('.event-card');
            }
          }

          if (count) {
            count.textContent = `${events.length} evento${events.length !== 1 ? 's' : ''} encontrado${events.length !== 1 ? 's' : ''}`;
          }
        }

        async function loadEvents(force) {
          const list = document.getElementById('eventsList');
          if (!list) return;
          const btn = document.getElementById('btnEventsRefresh');
          if (btn) btn.disabled = true;

          renderState('Buscando eventos automotivos...', null, false);

          try {
            const url = `${CONFIG.API_URL}/api/events/automotive${force ? '?force=1' : ''}`;
            const response = await fetch(url);
            const data = await response.json();
            if (!data.success) {
              throw new Error(data.error || 'Erro na varredura de eventos');
            }
            allEvents = (data.events || []).filter((e) => !e.passado);
            renderEvents();
          } catch (error) {
            console.error('Erro ao carregar eventos:', error);
            renderState('Não foi possível carregar os eventos agora. Tente novamente em instantes.', 'fa-triangle-exclamation', true);
          } finally {
            if (btn) btn.disabled = false;
          }
        }

        const btnRefresh = document.getElementById('btnEventsRefresh');
        if (btnRefresh) btnRefresh.addEventListener('click', () => loadEvents(true));
        initUfSelect();
        loadEvents(false);
      });
    </script>
  <script src="static/js/analytics-consent.js"></script>
</body>
