<style>

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .logo {
            font-weight: 800;

            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo img {
            height: 72px !important;
            width: auto;
        }
        /* Content Area */
        .dashboard-content {
            max-width: 1000px;
            margin: 100px auto 40px;
            padding: 0 2rem;
        }
        .dashboard-header {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out;
        }
        .dashboard-header h1 {
            font-size: 2.5rem;

            color: var(--accent);

        }
        /* Vehicle Card */
        .vehicle-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 20px;

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof Auth === 'undefined' || !Auth.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            const user = await Auth.syncUser({ redirectOnInvalid: true });
            if (!user) return;

            if (!Auth.requirePremiumPage({
                title: 'Dashboard Premium',
                message: 'Para acessar o Dashboard, ative o plano Premium.',
                backHref: 'index.html'
            })) {
                return;
            }

            const premiumVideosLink = document.getElementById('premiumVideosLink');
            if (premiumVideosLink) premiumVideosLink.style.display = 'flex';

            const content = document.getElementById('dashboardContent');
            
            // Exibição instantânea via Cache
            const cachedDash = Auth.Cache.get('autoassist_dashboard_cache');
            if (cachedDash) renderDashboard(cachedDash, {});

            try {
                const [dashRes, alertsRes, veicRes] = await Promise.all([
                    Auth.authenticatedFetch('/api/dashboard'),
                    Auth.authenticatedFetch('/api/maintenance/alerts', { redirectOnInvalid: false }),
                    Auth.authenticatedFetch('/api/veiculos', { redirectOnInvalid: false }),
                ]);

                let modMap = {};
                if (veicRes.ok) {
                    try {
                        const vj = await veicRes.json();
                        (vj.veiculos || []).forEach(v => { modMap[v.id] = v; });
                    } catch (e) { /* ignora */ }
                }
                window.__modMap = modMap;

                if (dashRes.status === 404) {
                    content.innerHTML = `<div class="no-vehicle"><div class="no-vehicle-icon"><i class="fas fa-car-crash"></i></div><h2>Nenhum veículo cadastrado</h2><p>Vá ao perfil para cadastrar seu veículo.</p></div>`;
                    return;
                }

                if (!dashRes.ok) {
                    if (!cachedDash) {
                        content.innerHTML = '<div class="no-vehicle"><h2>Erro de conexão</h2><p>Tente novamente mais tarde.</p></div>';
                    }
                    return;
                }

                const data = await dashRes.json();

                if (!Array.isArray(data) || data.length === 0) {
                    content.innerHTML = `<div class="no-vehicle"><div class="no-vehicle-icon"><i class="fas fa-car-crash"></i></div><h2>Nenhum veículo cadastrado</h2><p>Vá ao perfil para cadastrar seu veículo.</p></div>`;
                    return;
                }

                // Consome /api/maintenance/alerts e agrupa por veículo
                const alertsByVehicle = {};
                if (alertsRes.ok) {
                    const alertsData = await alertsRes.json();
                    const alertas = alertsData.alertas || alertsData || [];
                    alertas.forEach(a => {
                        if (a.vehicle_id == null) return;
                        (alertsByVehicle[a.vehicle_id] = alertsByVehicle[a.vehicle_id] || []).push(a);
                    });
                }

                Auth.Cache.set('autoassist_dashboard_cache', data);
                renderDashboard(data, alertsByVehicle, modMap);
            } catch (error) {
                console.warn('Erro ao atualizar dashboard:', error);
                if (!cachedDash) {
                    content.innerHTML = '<div class="no-vehicle"><h2>Erro de conexão</h2><p>Tente novamente mais tarde.</p></div>';
                }
            }
        });

        function escapeHTML(str) {
            if (!str) return "";
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function brl(v) {
            if (v == null) return '';
            const n = Number(v);
            if (isNaN(n)) return '';
            return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        function parseMods(m) {
            if (!m) return [];
            if (Array.isArray(m)) return m;
            try { const p = JSON.parse(m); return Array.isArray(p) ? p : []; }
            catch (e) { return []; }
        }
        function safeNum(v) {
            if (v === null || v === undefined) return null;
            const n = Number(v);
            return isNaN(n) ? null : n;
        }
        function parseNumeric(v) {
            if (v == null) return null;
            if (typeof v === 'number') return v;
            const m = String(v).replace(/\./g, '').replace(',', '.').match(/\d+(\.\d+)?/);
            return m ? Number(m[0]) : null;
        }
        function vehiclePhotoSrc(b64) {
            if (!b64) return null;
            let mime = 'image/jpeg';
            if (b64.startsWith('iVBOR')) mime = 'image/png';
            else if (b64.startsWith('R0lG')) mime = 'image/gif';
            return `data:${mime};base64,${b64}`;
        }
        function fipeCardValue(fipe) {
            if (!fipe) return null;
            if (fipe.Valor != null) return fipe.Valor;
            if (fipe.preco != null) return fipe.preco;
            if (fipe.valor != null) return fipe.valor;
            return null;

        function buildModPassportCard(id, modMap, fipeCard) {
            const mod = (modMap && modMap[id]) || null;
            let base = safeNum(mod && mod.fipe_valor);
            if (base == null) base = parseNumeric(fipeCard);
            let ajustada = safeNum(mod && mod.fipe_ajustada);
            if (ajustada == null) ajustada = base;
            const mods = parseMods(mod ? mod.modificacoes : null);
            let badge = '<span class="modp-badge flat">sem ajuste</span>';
            if (base != null && ajustada != null && Number(ajustada) !== Number(base)) {
                const pct = ((ajustada - base) / base) * 100;
                badge = `<span class="modp-badge up">+${pct.toFixed(1).replace('.', ',')}%</span>`;
            }
            const countText = mods.length
                ? `<p class="modp-empty">${mods.length} modificação(ões) registrada(s)</p>`
                : `<p class="modp-empty">Nenhuma modificação ainda</p>`;
            const fonte = mod && mod.fipe_ajustada_fonte
                ? `<div class="modp-line modp-fonte"><span class="label">Base</span><span class="value">${mod.fipe_ajustada_fonte}</span></div>`
                : '';
            const aviso = mod && mod.fipe_ajustada_aviso
                ? `<p class="modp-aviso">${mod.fipe_ajustada_aviso}</p>`
                : '';
            return `
                <div class="modp-line"><span class="label">FIPE fábrica</span><span class="value" id="modBase-${id}">${brl(base)}</span></div>
                <div class="modp-line"><span class="label">Valor estimado</span><span class="value modp-value-ajustada" id="modAdj-${id}">${brl(ajustada)} ${badge}</span></div>

        async function fetchHealthTrend() {

                const data = await res.json();
                if (!data || data.length === 0) return;
                
                const grouped = {};
                for (const row of data) {
                    if (!grouped[row.vehicle_id]) grouped[row.vehicle_id] = [];
                    grouped[row.vehicle_id].push(row);
                }

                for (const vid in grouped) {
                    if (grouped[vid].length >= 2) {
                        renderHealthTrend(vid, grouped[vid]);
                    }
                }
            } catch {}
        }

        function renderHealthTrend(vehicleId, data) {
            const statCard = document.querySelector(`.stat-card[data-vehicle-id="${vehicleId}"]`);
            if (!statCard) return;
            
            const scores = data.map(d => d.score);
            const labels = data.map(d => {
                const date = new Date(d.recorded_at);
                return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            });
            const min = Math.min(...scores);
            const max = Math.max(...scores);
            const range = max - min || 1;
            const w = 280, h = 80;
            const padding = { top: 6, bottom: 16, left: 4, right: 4 };
            const chartW = w - padding.left - padding.right;
            const chartH = h - padding.top - padding.bottom;

            const points = scores.map((s, i) => {
                const x = padding.left + (i / (scores.length - 1)) * chartW;
                const y = padding.top + chartH - ((s - min) / range) * chartH;
                return `${x},${y}`;
            });
            const line = points.join(' ');

            const color = scores[scores.length - 1] >= 80 ? '#22c55e' : scores[scores.length - 1] >= 50 ? '#f59e0b' : '#ef4444';

            const svg = `
                <div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1)">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">

                            <i class="fas fa-chart-line"></i>
                        </div>
                        <div class="stat-card-title" style="font-size:13px;font-weight:600;color:var(--text-secondary)">Tendência do Health Score</div>
                    </div>
                    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;display:block">
                        <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                        ${points.map((p, i) => {
                            const [cx, cy] = p.split(',');
                            return `<circle cx="${cx}" cy="${cy}" r="3" fill="${color}" opacity="0.8"/>`;
                        }).join('')}
                        <text x="${padding.left}" y="${h - 2}" font-size="8" fill="var(--text-muted)">${labels[0] || ''}</text>
                        <text x="${w - padding.right}" y="${h - 2}" font-size="8" fill="var(--text-muted)" text-anchor="end">${labels[labels.length - 1] || ''}</text>
                    </svg>
                </div>
            `;
            statCard.insertAdjacentHTML('beforeend', svg);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});

        }

                    const res = await Auth.authenticatedFetch(`/api/veiculos/${currentModVehicleId}/mod-passport/share`, { method: 'POST', redirectOnInvalid: false });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) { status.textContent = data.error || 'Erro ao exportar.'; status.className = 'mod-status error'; return; }
                    window.open(data.share_url + '/pdf', '_blank', 'noopener');
                    status.textContent = 'PDF gerado.';
                    status.className = 'mod-status ok';
                } catch (e) { status.textContent = 'Erro de conexão.'; status.className = 'mod-status error'; }
            });
            document.getElementById('modCopyUrl').addEventListener('click', () => {
                const url = document.getElementById('modShareUrl').value;
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(() => {
                        const s = document.getElementById('modStatus');
                        s.textContent = 'Link copiado!'; s.className = 'mod-status ok';
                    });
                }
            });
        })();
    </script>
    <div class="modal-overlay" id="vehicleModal">
        <div class="modal-box vehicle-modal-box">
            <div id="vehicleModalBody"></div>
        </div>
    </div>

    <script>
        (function () {
            const MOD_LABELS = {
                visual: 'Visual', performance: 'Performance', audio: 'Áudio',
                rodas: 'Rodas', suspensao: 'Suspensão', interior: 'Interior',
                eletronica: 'Eletrônica', outro: 'Outro'
            };

            window.openVehicleModal = async function (vehicleId) {
                const data = window.__dashboardData || [];
                const item = data.find(d => d.veiculo && d.veiculo.id === vehicleId);
                const modMap = window.__modMap || {};
                const alertsByVehicle = window.__alertsByVehicle || {};
                if (!item) return;

                const v = item.veiculo || {};
                const extras = item.estatisticas_extras || {};
                const pred = item.predicao || {};
                const fipeData = item.fipe || null;
                const mod = modMap[vehicleId] || null;
                const icons = {'moto':'fa-motorcycle','caminhao':'fa-truck','aviao':'fa-plane','navio':'fa-ship','geral':'fa-car'};
                const iconClass = icons[v.tipo] || 'fa-car';
                const fotoSrc = vehiclePhotoSrc(v.foto_base64);
                const health = extras.health_score || 0;
                const fipeCardValor = fipeCardValue(item.fipe);
                let base = safeNum(mod && mod.fipe_valor);
                if (base == null) base = parseNumeric(fipeCardValor);
                let ajustada = safeNum(mod && mod.fipe_ajustada);
                if (ajustada == null) ajustada = base;
                const mods = parseMods(mod ? mod.modificacoes : null);
                let badge = '';
                if (base != null && ajustada != null && Number(ajustada) !== Number(base)) {
                    const pct = ((ajustada - base) / base) * 100;
                    badge = ` <span class="vm-badge">+${pct.toFixed(1).toString().replace('.', ',')}%</span>`;
                }
                const realAlerts = (alertsByVehicle[vehicleId]) || item.saude || [];
                const alertItems = realAlerts.length
                    ? realAlerts.map(a => `<div class="alert-item"><div class="alert-content"><div class="alert-title">${escapeHTML(a.item)}</div><div class="alert-desc">${escapeHTML(a.msg)}</div></div><span class="alert-badge badge-${escapeHTML((a.status || '').toLowerCase())}">${escapeHTML(a.status)}</span></div>`).join('')
                    : '<p class="vm-empty">Nenhum alerta no momento.</p>';
                const modItems = mods.length
                    ? mods.map(m => `<div class="vm-mod"><div><span class="cat">${escapeHTML(MOD_LABELS[m.categoria] || m.categoria || '')}</span><div>${escapeHTML(m.nome || '')}</div></div><div>${m.valor != null ? brl(m.valor) : '<span class="vm-empty">sem valor</span>'}</div></div>`).join('')
                    : '<p class="vm-empty">Nenhuma modificação registrada.</p>';
                const predHtml = pred.predicted_next_km
                    ? `${pred.predicted_next_km.toLocaleString()} km · ${escapeHTML(pred.maintenance_label || 'Manutenção')} (${pred.predicted_next_date})`
                    : 'Sem previsão';

                const body = document.getElementById('vehicleModalBody');
                body.innerHTML = `
                    <div class="vm-header">
                        <div class="vm-icon">${fotoSrc ? `<img src="${fotoSrc}" alt="Foto do veículo" class="vm-photo">` : `<i class="fas ${iconClass}"></i>`}</div>
                        <div>
                            <h3>${escapeHTML(v.marca || '')} ${escapeHTML(v.modelo || '')}</h3>
                            <div class="vm-sub">${escapeHTML(v.ano_fabricacao || '---')} · ${v.quilometragem ? Number(v.quilometragem).toLocaleString() : '---'} km</div>
                        </div>
                    </div>
                    <div class="vm-stats">
                        <div class="vm-stat"><div class="v">${health}</div><div class="l">Health</div></div>
                        <div class="vm-stat"><div class="v">${brl(ajustada)}</div><div class="l">Valor estimado</div></div>
                        <div class="vm-stat"><div class="v">${extras.manutencoes_realizadas || 0}</div><div class="l">Manutenções</div></div>
                        <div class="vm-stat"><div class="v">${extras.chats_realizados || 0}</div><div class="l">Chats NOG</div></div>
                    </div>
                    <div class="vm-section">
                        <h4>Mod Passport</h4>
                        <div class="modp-line"><span class="label">FIPE fábrica</span><span class="value">${brl(base)}</span></div>
                        <div class="modp-line"><span class="label">Valor estimado</span><span class="value modp-value-ajustada">${brl(ajustada)}${badge}</span></div>
                        <div style="margin:0.6rem 0;">${modItems}</div>
                        <button class="btn-action" style="width:100%;justify-content:center;" onclick="openModPassport(${vehicleId})"><i class="fas fa-edit"></i> Gerenciar Mod Passport</button>
                    </div>
                    <div class="vm-section">
                        <h4>Próxima manutenção prevista</h4>
                        <p>${predHtml}</p>
                    </div>
                    <div class="vm-section">
                        <h4>Alertas de manutenção</h4>
                        ${alertItems}
                    </div>
                    <div class="vm-section">
                        <h4>Histórico de manutenções</h4>
                        <div id="vmHistory"><p class="vm-empty">Carregando...</p></div>
                    </div>
                `;
                document.getElementById('vehicleModal').classList.add('open');
                loadVehicleHistory(vehicleId);
            };

            async function loadVehicleHistory(vehicleId) {
                const el = document.getElementById('vmHistory');
                if (!el) return;
                try {
                    const res = await Auth.authenticatedFetch(`/api/maintenance/history?vehicle_id=${vehicleId}`, { redirectOnInvalid: false });
                    if (!res.ok) { el.innerHTML = '<p class="vm-empty">Histórico indisponível.</p>'; return; }
                    const data = await res.json();
                    const hist = data.historico || [];
                    if (!hist.length) { el.innerHTML = '<p class="vm-empty">Nenhuma manutenção registrada.</p>'; return; }
                    el.innerHTML = '<ul class="vm-timeline">' + hist.map(h => {
                        const d = h.service_date ? new Date(h.service_date).toLocaleDateString('pt-BR') : '';
                        const title = h.service_type || h.item || h.title || 'Manutenção';
                        const note = h.notes || h.description || '';
                        const cost = h.cost != null ? brl(h.cost) : '';
                        return `<li><span class="vm-dot"></span><div><div style="font-weight:600;">${escapeHTML(title)}</div><div class="vm-sub">${d}${cost ? ' · ' + cost : ''}</div>${note ? `<div class="vm-sub">${escapeHTML(note)}</div>` : ''}</div></li>`;
                    }).join('') + '</ul>';
                } catch (e) {
                    el.innerHTML = '<p class="vm-empty">Erro ao carregar histórico.</p>';
                }
            }

            const vmOverlay = document.getElementById('vehicleModal');
            vmOverlay.addEventListener('click', (e) => { if (e.target.id === 'vehicleModal') vmOverlay.classList.remove('open'); });
        })();
    </script>
        <script>
        if (typeof Navbar !== 'undefined') { Navbar.init({ validate: true }); }
        (function () {
            var toggle = document.getElementById('navToggle');
            var links = document.getElementById('authLinks');
            if (toggle && links) {
                toggle.addEventListener('click', function () {
                    var open = links.classList.toggle('nav-open');
                    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                });
                links.addEventListener('click', function (e) {
                    if (e.target.closest('a')) { links.classList.remove('nav-open'); toggle.setAttribute('aria-expanded', 'false'); }
                });
            }
        })();
    </script>

  <script src="static/js/analytics-consent.js"></script>
</body>
</html>
