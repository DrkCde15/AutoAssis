<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Feedbacks - AutoAssist</title>
    <link rel="icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="shortcut icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="static/fonts/fonts.css">
<style>
:root {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --bg-card: #1c1c1f;
            --bg-input: #27272a;
            --border-color: #27272a;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 64px 24px;
        }
        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 18px;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
        }
        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-title i {
            color: var(--accent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .form-control {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }
        .rating {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }
        .star {
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        .star:hover, .star.active {
            color: var(--warning);
            transform: scale(1.1);
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        /* Recent Feedbacks */
        .feedback-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .feedback-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
        }
        .feedback-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .feedback-user {
            font-weight: 600;
            font-size: 14px;
        }
        .feedback-stars {
            color: var(--warning);
            font-size: 12px;
        }
        .feedback-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .feedback-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
        }
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 32px;
            }
        }
        .feedback-actions {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn:hover {
            color: var(--text-primary);
        }
        .action-btn.delete:hover {
            color: #ef4444;
        }
        .edit-mode .feedback-text {
            display: none;
        }
        .edit-form {
            display: none;
            margin-top: 12px;
        }
        .edit-mode .edit-form {
            display: block;
        }
        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .btn-cancel {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--success);
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        /* Mobile nav toggle (hidden on desktop) */
        .nav-toggle { display: none; }
        @media (max-width: 768px) {
            .nav-toggle {
                display: inline-flex; align-items: center; justify-content: center;
                margin-left: auto; width: 44px; height: 44px;
                border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
                background: transparent; color: var(--text-primary); font-size: 18px; cursor: pointer;
            }
            .nav-links.nav-open { display: flex; }
        }
        .nav-logo-icon {
            width: auto; height: auto; background: transparent; border-radius: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-logo-text {
            font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
        }
    </style>
    <link rel="stylesheet" href="static/css/responsive.css">
  <link rel="stylesheet" href="static/css/shared.css">

  <link rel="stylesheet" href="static/css/animations.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-icon">
                    <img src="logo.png?v=20260608" alt="AutoAssist IA" style="height:84px;width:auto;">
                </div>
                <span class="nav-logo-text">AutoAssist</span>
            </a>
            <div class="nav-links" id="authLinks"></div>
            
        </div>
    </nav>

<main class="container">
    <header class="header">
        <h1>Sua opinião é <span>fundamental</span></h1>
        <p>Ajude-nos a construir o futuro da assistência automotiva inteligente.</p>
    </header>

    <div class="layout">
        <!-- Feedback Form -->
        <section class="card">
            <h2 class="card-title"><i class="fas fa-pen-nib"></i> Deixe seu Feedback</h2>
            <form id="feedbackForm">
                <div class="form-group">
                    <label>Como você avalia sua experiência?</label>
                    <div class="rating" id="starRating">
                        <i class="fas fa-star star active" data-value="1"></i>
                        <i class="fas fa-star star active" data-value="2"></i>
                        <i class="fas fa-star star active" data-value="3"></i>
                        <i class="fas fa-star star active" data-value="4"></i>
                        <i class="fas fa-star star active" data-value="5"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="userName">Seu Nome (Opcional)</label>
                    <input type="text" id="userName" class="form-control" placeholder="Ex: Júlio César">
                </div>

                <div class="form-group">
                    <label for="userEmail">Seu Email (Opcional)</label>
                    <input type="email" id="userEmail" class="form-control" placeholder="exemplo@email.com">
                </div>

                <div class="form-group">
                    <label for="comment">Seu Comentário</label>
                    <textarea id="comment" class="form-control" placeholder="Conte-nos o que você achou, sugestões ou críticas..." required></textarea>
                </div>

    <button type="submit" class="btn-submit" id="btnSubmit">
                    <i class="fas fa-paper-plane"></i>
                    Enviar Feedback
                </button>
            </form>
        </section>

        <!-- Feedback List -->
        <section>
            <h2 class="card-title"><i class="fas fa-comments"></i> O que dizem nossos usuários</h2>
            <div class="feedback-list" id="feedbackList">
                <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                    <i class="fas fa-spinner fa-spin"></i> Carregando feedbacks...
                </div>
            </div>
        </section>
    </div>
</main>

<div class="toast" id="toast">
    <div style="display: flex; align-items: center; gap: 12px;">
        <i class="fas fa-check-circle" style="color: var(--success); font-size: 20px;"></i>
        <div>
            <div style="font-weight: 700;">Sucesso</div>
            <div style="font-size: 13px; color: var(--text-secondary);">Seu feedback foi enviado e encaminhado ao administrador.</div>
        </div>
    </div>
</div>
