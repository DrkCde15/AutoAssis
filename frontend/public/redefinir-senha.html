    <style>
:root {
        --bg-primary: #09090b;
        --bg-secondary: #18181b;
        --bg-card: #1c1c1f;
        --border-color: #27272a;
        --border-focus: #3b82f6;
        --text-primary: #fafafa;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --accent-soft: rgba(59, 130, 246, 0.1);
        --danger: #ef4444;
        --success: #22c55e;
        --radius: 12px;
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      body {
        font-family: var(--font-sans);
        background: var(--bg-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text-primary);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59, 130, 246, 0.15), transparent),
          radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.08), transparent);
        pointer-events: none;
        z-index: 0;
      }
      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 36px;
        box-shadow: var(--shadow-lg);
      }
      .logo { text-align: center; margin-bottom: 24px; }
      .logo img { height: 72px; width: auto; }
      .logo h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .logo p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
      .alert {
        display: none;
        padding: 14px 16px;
        border-radius: var(--radius);
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: 500;
        border: 1px solid;
      }
      .alert-error {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }
      .alert-success {
        background: rgba(34, 197, 94, 0.1);
        border-color: rgba(34, 197, 94, 0.2);
        color: #86efac;
      }
      .form-group { margin-bottom: 16px; }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }
      .input-wrapper { position: relative; }
      .input-wrapper i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 14px 16px 14px 44px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        transition: var(--transition);
        outline: none;
      }
      input::placeholder { color: var(--text-muted); }
      input:focus {
        border-color: var(--border-focus);
        background: var(--bg-primary);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .btn {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(135deg, var(--accent), #1d4ed8);
        color: #fff;
        box-shadow: 0 2px 12px rgba(59, 130, 246, 0.3);
      }
      .btn:hover:not(:disabled) {
        background: linear-gradient(135deg, var(--accent-hover), #1e40af);
        transform: translateY(-1px);
      }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .links {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: var(--text-secondary);
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      .links a:hover { text-decoration: underline; }
        .nav-logo-icon { width:auto; height:auto; background:transparent; border-radius:0; display:flex; align-items:center; justify-content:center; }
        .nav-logo-text { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
        body.auth-page { padding-top: 104px; }
        .nav-toggle { display: none; }
        @media (max-width: 768px) {
            .nav-toggle {
                display: inline-flex; align-items: center; justify-content: center;
                margin-left: auto; width: 44px; height: 44px;
                border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
                background: transparent; color: var(--text-primary); font-size: 18px; cursor: pointer;
            }
            .nav-links.nav-open { display: flex; }
        }
  </style>

    <nav class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:1000;">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-icon">
                    <img src="logo.png?v=20260608" alt="AutoAssist IA" style="height:84px;width:auto;">
                </div>
                <span class="nav-logo-text">AutoAssist</span>
            </a>
            <div class="nav-links" id="authLinks"></div>
            
        </div>
    </nav>
    <div class="container">
      <div class="logo">
        <img src="logo.png?v=20260511" alt="AutoAssist IA">
        <h1>Redefinir senha</h1>
        <p>Digite sua nova senha para concluir</p>
      </div>

      <div id="alertError" class="alert alert-error"></div>
      <div id="alertSuccess" class="alert alert-success"></div>

      <div class="form-group">
        <label>Nova senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input id="password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
        </div>
      </div>

      <div class="form-group">
        <label>Confirmar nova senha</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input id="password2" type="password" placeholder="Repita sua nova senha" autocomplete="new-password">
        </div>
      </div>

      <button id="btnReset" class="btn">
        Redefinir senha
        <i class="fas fa-check"></i>
      </button>

      <div class="links">
        <a href="login.html">Voltar para login</a>
      </div>
    </div>
