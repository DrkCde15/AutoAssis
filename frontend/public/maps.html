<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAssist - Mapa</title>
    <link rel="icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="shortcut icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Leaflet CSS (OpenStreetMap) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="static/fonts/fonts.css">
<!-- Shared CSS -->
    <link rel="stylesheet" href="static/css/shared.css">
    <link rel="stylesheet" href="static/css/notifications.css">
    <link rel="stylesheet" href="static/css/animations.css">
    <link rel="stylesheet" href="static/css/responsive.css">
    <link rel="stylesheet" href="static/css/app-select.css">
    
    <style>
        :root {
            --panel-width: 420px;
        }
        .logo-link {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
.logo-link img {
            height: 84px;
            width: auto;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Page layout */
        .page-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            padding-top: 96px;
        }
        
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: var(--panel-width) 1fr;
            gap: 0;
            height: 100%;
            overflow: hidden;
        }
        
        /* Search Panel */
        .search-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .search-panel::-webkit-scrollbar { width: 4px; }
        
        .search-header {
            margin-bottom: 20px;
        }
        
        .search-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .search-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Search Form */
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
.form-group label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-group .field-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-group input,
        .form-group select {
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }
        
        .btn-search {
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
        }
        
        .btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Filters */
        .filters {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            margin-bottom: 14px;
        }
        
        .filter-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .filter-chip {
            padding: 5px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        
        .filter-chip:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }
        
        .filter-chip.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }
        
        /* Section Tabs */
        .section-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-input);
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 14px;
        }
        
        .section-tab {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .section-tab:hover {
            color: var(--text-primary);
        }
        
        .section-tab.active {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        /* Mechanics List */
        .mechanics-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        
        .mechanics-list::-webkit-scrollbar { width: 4px; }
        
        .mechanic-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .mechanic-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }
        
        .mechanic-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        
        .mechanic-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .mechanic-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        
        .mechanic-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .verified-badge {
            color: var(--accent);
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .mechanic-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 10px;
            background: rgba(37, 211, 102, 0.12);
            color: #25d366;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
        }
        .btn-whatsapp:hover {
            background: #25d366;
            color: #fff;
        }
        .contact-whatsapp a {
            color: #25d366;
            font-weight: 600;
        }
        .contact-whatsapp a:hover {
            text-decoration: underline;
        }

        .btn-favorite {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: var(--transition);
        }
        
        .btn-favorite:hover {
            color: var(--danger);
            background: var(--danger-soft);
        }
        
        .btn-favorite.is-favorite {
            color: var(--danger);
        }
        
        .mechanic-rating {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--warning);
            font-size: 13px;
        }
        
        .mechanic-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        
        .mechanic-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .mechanic-info-item i {
            width: 14px;
            color: var(--accent);
            font-size: 12px;
        }
        
        .mechanic-services {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 10px;
        }
        
        .service-tag {
            padding: 3px 8px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-ring);
            border-radius: 14px;
            color: var(--accent);
            font-size: 11px;
        }
        
        .mechanic-distance {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        /* Favorites Section */
        .favorites-section {
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            margin-bottom: 14px;
        }
        
        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .favorites-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .favorites-header h3 i {
            color: var(--danger);
            margin-right: 6px;
        }
        
        .favorites-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .favorite-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .favorite-item:hover {
            border-color: var(--accent);
        }
        
        .favorite-item-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .favorite-item-rating {
            font-size: 12px;
            color: var(--warning);
        }
        
        .favorite-item-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }
        
        .favorite-item-remove:hover {
            color: var(--danger);
            background: var(--danger-soft);
        }
        
        .favorites-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 12px;
        }
        
        /* Map Container */
        .map-container {
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state i {
            font-size: 40px;
            margin-bottom: 12px;
            color: var(--accent);
        }
        
        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        
        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        
        .modal-overlay.open {
            display: flex;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.25s ease;
        }

        .modal-header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        
        .modal-header-info {
            flex: 1;
            min-width: 0;
        }
        
        .modal-header-info h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .modal-header-info .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        
        .modal-close:hover {
            color: var(--text-primary);
            background: var(--border-color);
        }
        
        .modal-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 20px 24px 24px;
        }

        /* Scrollbar utilizável do corpo do modal */
        .modal-body {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.6) transparent;
        }
        .modal-body::-webkit-scrollbar {
            width: 10px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.6);
            border-radius: 999px;
            border: 3px solid transparent;
            background-clip: content-box;
        }
        .modal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.85);
            background-clip: content-box;
        }
        
        .detail-section {
            margin-bottom: 20px;
        }
        
        .detail-section:last-child {
            margin-bottom: 0;
        }
        
        .detail-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .detail-section-title i {
            color: var(--accent);
        }
        
        .detail-description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        /* Services Table */
        .services-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .services-table th,
        .services-table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .services-table th {
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .services-table td {
            color: var(--text-primary);
        }
        
        .services-table .price {
            color: var(--success);
            font-weight: 600;
            white-space: nowrap;
        }
        
        /* Hours Grid */
        .hours-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        
        .hours-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            background: var(--bg-card);
            border-radius: 6px;
            font-size: 13px;
        }
        
        .hours-day {
            color: var(--text-secondary);
        }
        
        .hours-time {
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .hours-closed {
            color: var(--danger);
        }
        
        /* Contact Info */
        .contact-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .contact-item i {
            width: 16px;
            color: var(--accent);
        }
        
        .contact-item a {
            color: var(--accent);
        }
        
        .contact-item a:hover {
            text-decoration: underline;
        }
        
        /* Reviews */
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .review-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px;
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .review-user {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .review-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }
        
        .review-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .review-date {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .review-stars {
            color: var(--warning);
            font-size: 13px;
        }
        
        .review-comment {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        .review-service {
            display: inline-block;
            padding: 2px 6px;
            background: var(--accent-soft);
            border-radius: 10px;
            font-size: 11px;
            color: var(--accent);
            margin-top: 6px;
        }
        
        .review-form {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
        }
        
        .review-form-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .star-rating {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
        }
        
        .star-rating i {
            font-size: 22px;
            color: var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .star-rating i.hover,
        .star-rating i.selected {
            color: var(--warning);
        }
        
        .review-form textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
        }
        
        .review-form textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-ring);
        }
        
        .review-form .btn-submit-review {
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .review-form .btn-submit-review:hover {
            background: var(--accent-hover);
        }
        
        .review-form .btn-submit-review:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        

        
        /* Map popup custom */
        .mechanic-popup {
            font-family: var(--font-sans);
        }
        
        .mechanic-popup h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #09090b;
        }
        
        .mechanic-popup .popup-rating {
            color: var(--warning);
            font-size: 13px;
        }
        
        .mechanic-popup .popup-addr {
            font-size: 12px;
            color: #71717a;
            margin: 4px 0;
        }
        
        .mechanic-popup .popup-dist {
            font-size: 12px;
            color: #3b82f6;
            font-weight: 500;
        }
        
        .mechanic-popup .popup-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #3b82f6;
            cursor: pointer;
            font-weight: 600;
        }
        
.mechanic-popup .popup-link:hover {
            text-decoration: underline;
        }
        
        /* Tooltip com visual de card (pré-visualização no hover) */
        .leaflet-tooltip.map-preview-tooltip {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
            padding: 10px 12px;
            max-width: 280px;
            width: fit-content;
            min-width: 160px;
            white-space: normal;
            overflow-wrap: break-word;
            box-sizing: border-box;
            opacity: 1;
        }
        .leaflet-tooltip.map-preview-tooltip::before {
            border: none;
        }
        .leaflet-tooltip.map-preview-tooltip .mechanic-popup h4 {
            color: #09090b;
        }
        .leaflet-tooltip.map-preview-tooltip .mechanic-popup {
            line-height: 1.4;
        }
        .leaflet-tooltip.map-preview-tooltip .popup-addr {
            color: #71717a;
            word-break: break-word;
            margin: 3px 0;
        }
        .leaflet-popup-content {
            max-width: 280px;
            max-height: 260px;
            overflow-y: auto;
            overscroll-behavior: contain;
        }
