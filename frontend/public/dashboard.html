<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAssist - Dashboard</title>
    <link rel="icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="shortcut icon" type="image/png" href="static/logo2.png?v=20260506">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="static/fonts/fonts.css">
<style>

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .logo img {
            height: 72px !important;
            width: auto;
        }
        /* Content Area */
        .dashboard-content {
            max-width: 1000px;
            margin: 100px auto 40px;
            padding: 0 2rem;
        }
        .dashboard-header {
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out;
        }
        .dashboard-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .dashboard-header h1 span {
            color: var(--accent);
        }
        .dashboard-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        /* Vehicle Card */
        .vehicle-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }
        .vehicle-icon {
            width: 80px;
            height: 80px;
            background: rgba(0, 122, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent);
        }
        .vehicle-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }
        .vm-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }
        .vehicle-info h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }
        .vehicle-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--text-secondary);
        }
        .vehicle-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem;
        }
        .stat-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
        }
        .stat-card-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        .stat-card-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .stat-subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        /* Health Score SVG Circular Chart */
        .health-score-container {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
            padding: 10px 0;
        }
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 100px;
            max-height: 100px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }
        .circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            animation: progress 1s ease-out forwards;
            transform: rotate(-90deg);
            transform-origin: 50px 50px;
        }
        @keyframes progress {
            0% { stroke-dashoffset: 251.2; }
        }
        .percentage {
            fill: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 28px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .health-score-text p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        /* State of Health Section */
        .alert-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .alert-title {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .alert-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .alert-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-crítico, .badge-atencao { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
        .badge-atenção, .badge-aviso { background: rgba(255, 204, 0, 0.15); color: var(--warning); }
        .badge-ok { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 1.5rem;
            width: 100%;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--text-secondary);
        }
        .loading i {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }
        .no-vehicle {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-card);
            border-radius: 32px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .no-vehicle-icon {
            font-size: 4rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .section-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin: 4rem 0;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 860px) {
            .vehicle-card { flex-direction: column; text-align: center; gap: 1rem; }
            .vehicle-meta { justify-content: center; flex-wrap: wrap; }
            .dashboard-header h1 { font-size: 2rem; }
        }
        .garagem-toolbar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(0,122,255,0.05) 100%);
            border: 1px solid rgba(0,122,255,0.2);
            border-radius: 18px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 2rem;
        }
        .garagem-stat { display: flex; flex-direction: column; gap: 0.2rem; }
        .garagem-label { color: var(--text-secondary); font-size: 0.8rem; font-weight: 500; }
        .garagem-value { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
        .garagem-add { margin-left: auto; }

        .stat-card.modpassport {
            background: linear-gradient(145deg, var(--bg-card) 0%, rgba(59,130,246,0.06) 100%);
            border-color: rgba(59,130,246,0.25);
        }
        .modp-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .modp-line .label { color: var(--text-secondary); font-size: 0.85rem; }
        .modp-line .value { font-weight: 700; font-size: 1.05rem; }
        .modp-value-ajustada { color: var(--success); }
        .modp-fonte .value { font-weight: 500; font-size: 0.82rem; color: var(--muted); }
        .modp-aviso { font-size: 0.72rem; color: var(--muted); line-height: 1.3; margin: 6px 0 0; }
        .modp-badge {
            display: inline-block;
            margin-left: 0.4rem;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .modp-badge.up { background: rgba(48,209,88,0.15); color: var(--success); }
        .modp-badge.flat { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        .modp-empty { color: var(--text-secondary); font-size: 0.85rem; margin: 0.5rem 0; }
        .modp-btn { margin-top: 1rem; width: 100%; justify-content: center; }

        .vehicle-detail-btn {
            margin-left: auto;
            width: 40px; height: 40px;
            flex: 0 0 auto;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .vehicle-detail-btn:hover { color: #fff; border-color: var(--accent); background: rgba(59,130,246,0.12); }

        .vehicle-modal-box {
            width: min(720px, 95vw);
            max-height: 90vh;
            overflow: auto;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 1.5rem;
        }
        .vm-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.25rem; }
        .vm-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: rgba(0,122,255,0.12); color: var(--accent); flex: 0 0 auto; }
        .vm-header h3 { margin: 0; font-size: 1.4rem; }
        .vm-sub { color: var(--text-secondary); font-size: 0.9rem; }
        .vm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin: 1.1rem 0; }
        .vm-stat { background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.8rem 0.5rem; text-align: center; }
        .vm-stat .v { font-size: 1.2rem; font-weight: 700; }
        .vm-stat .l { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
        .vm-section { margin-top: 1.2rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,0.1); }
        .vm-section h4 { margin: 0 0 0.7rem; font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .vm-timeline { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
        .vm-timeline li { display: flex; gap: 0.75rem; align-items: flex-start; }
        .vm-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: 0 0 auto; }
        .vm-mod { display: flex; justify-content: space-between; gap: 1rem; padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.9rem; }
        .vm-mod .cat { color: var(--accent); font-size: 0.72rem; text-transform: uppercase; }
        .vm-empty { color: var(--text-secondary); font-size: 0.85rem; }
        .vm-badge { display:inline-block; padding:0.1rem 0.55rem; border-radius:999px; font-size:0.75rem; font-weight:700; background:rgba(48,209,88,0.15); color:var(--success); }
        @media (max-width: 560px) { .vm-stats { grid-template-columns: repeat(2, 1fr); } }

        #modPassportModal, #vehicleModal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 9999; padding: 1rem;
        }
        #modPassportModal { z-index: 10000; }
        #modPassportModal.open, #vehicleModal.open { display: flex; }
        .modal-box {
            position: relative; z-index: 1;
            opacity: 1; filter: none;
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            width: min(580px, 94vw);
            max-height: 90vh; overflow: auto;
            padding: 1.5rem;
        }
        .modal-box h3 { margin: 0 0 0.25rem; }
        .modal-box .modal-sub { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; }
        .mod-row {
            display: grid;
            grid-template-columns: 1.1fr 1.3fr 0.9fr auto;
            gap: 0.5rem; align-items: center;
            margin-bottom: 0.5rem;
        }
        .mod-row select, .mod-row input {
            width: 100%;
            padding: 0.55rem 0.6rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; color: var(--text-primary);
            font-size: 0.9rem;
        }
        .mod-row .mod-remove {
            background: rgba(255,69,58,0.12); color: var(--danger);
            border: none; border-radius: 10px; width: 36px; height: 36px;
            cursor: pointer; font-size: 1rem;
        }
        .mod-modal-actions { display: flex; gap: 0.6rem; margin-top: 1rem; }
        .mod-modal-actions .btn-action { flex: 1; justify-content: center; }
        .mod-status { margin-top: 0.75rem; font-size: 0.85rem; min-height: 1.1rem; }
        .mod-status.error { color: var(--danger); }
        .mod-status.ok { color: var(--success); }
        .mod-secondary { margin-top: 0.5rem; }
        .mod-secondary .btn-action { background: rgba(255,255,255,0.06); font-size: 0.85rem; }
        .mod-share-box { display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
        .mod-share-box input { flex: 1; padding: 0.45rem 0.6rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.25); color: #fff; font-size: 0.8rem; }
        .mod-share-box .btn-action { flex: 0 0 auto; font-size: 0.8rem; }
        .mod-history { margin-top: 0.75rem; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; }
        .mod-history-item { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.8rem; padding: 0.45rem 0.6rem; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .trust-banner { display: flex; gap: 0.85rem; align-items: center; margin: 18px 0 8px; padding: 14px 18px; border-radius: 14px; background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(48,209,88,0.08)); border: 1px solid rgba(59,130,246,0.35); }
        .trust-banner i { font-size: 1.5rem; color: var(--accent); }
        .trust-banner strong { display: block; font-size: 0.98rem; }
        .trust-banner span { font-size: 0.85rem; color: var(--muted); }
                .nav-logo-icon { width:auto; height:auto; background:transparent; border-radius:0; display:flex; align-items:center; justify-content:center; }
        .nav-logo-text { font-size:20px; font-weight:700; letter-spacing:-0.5px; }
        .nav-toggle { display: none; }
        @media (max-width: 768px) {
            .nav-toggle {
                display: inline-flex; align-items: center; justify-content: center;
                margin-left: auto; width: 44px; height: 44px;
                border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
                background: transparent; color: var(--text-primary); font-size: 18px; cursor: pointer;
            }
            .nav-links.nav-open { display: flex; }
        }
</style>

  <link rel="stylesheet" href="static/css/shared.css">
  <link rel="stylesheet" href="static/css/notifications.css">
    <link rel="stylesheet" href="static/css/animations.css">
</head>

            <nav class="navbar" style="position:fixed;top:0;left:0;right:0;z-index:1000;">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <div class="nav-logo-icon">
                    <img src="logo.png?v=20260608" alt="AutoAssist IA" style="height:56px;width:auto;">

    <div class="dashboard-content" id="dashboardContent" data-aa-reveal>
        <div id="loadingDash" class="loading">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p>Carregando dados do veículo...</p>
        </div>
    </div>

    <script src="static/js/config.js"></script>
    <script src="static/js/auth.js"></script>
    <script src="static/js/navbar.js"></script>
    <script src="static/js/animations/animations.js?v=1" defer></script>
    <script src="static/js/security-utils.js"></script>
    <script src="static/js/notifications.js" defer></script>
    <script src="static/js/responsive.js" defer></script>
    <script src="static/js/dashboard.js"></script>
    <div class="modal-overlay" id="modPassportModal">
        <div class="modal-box">
            <h3>Mod Passport</h3>
            <p class="modal-sub" id="modPassportSub"></p>
            <div id="modPassportRows"></div>
            <button class="btn-action" id="modAddRow" style="width:100%;justify-content:center;margin-top:.25rem;"><i class="fas fa-plus"></i> Adicionar modificação</button>
            <div class="mod-modal-actions">
                <button class="btn-action" id="modCancel" style="background:rgba(255,255,255,0.08);">Cancelar</button>
                <button class="btn-action" id="modSave"><i class="fas fa-save"></i> Salvar</button>
            </div>
            <div class="mod-modal-actions mod-secondary">
                <button class="btn-action" id="modHistory"><i class="fas fa-history"></i> Histórico</button>
                <button class="btn-action" id="modShare"><i class="fas fa-share-alt"></i> Compartilhar</button>
                <button class="btn-action" id="modExport"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
            </div>
            <div class="mod-status" id="modStatus"></div>
            <div id="modShareBox" class="mod-share-box" style="display:none;">
                <input type="text" id="modShareUrl" readonly />
                <button class="btn-action" id="modCopyUrl"><i class="fas fa-copy"></i> Copiar</button>
                <a class="btn-action" id="modPdfLink" target="_blank" rel="noopener">Abrir PDF</a>
            </div>
            <div id="modHistoryList" class="mod-history"></div>
        </div>
    </div>

    <script src="static/js/dashboard-modals.js"></script>
    <div class="modal-overlay" id="vehicleModal">
        <div class="modal-box vehicle-modal-box">
            <div id="vehicleModalBody"></div>
        </div>
    </div>

    <script src="static/js/dashboard-details.js"></script>
